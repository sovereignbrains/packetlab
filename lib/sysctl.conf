# packetlab: сетевой тюнинг ядра. Единственный источник — lib/sysctl.conf в репозитории,
# в /etc/sysctl.d/99-packetlab.conf его кладёт install.sh и `packetlab tune`.
# Строки с «-» в начале: если ядро такого параметра не знает, это не ошибка.

# --- буферы ---------------------------------------------------------------
# QUIC (Hysteria2) упирается в размер UDP-буферов: без этого quic-go пишет
# предупреждение в лог и режет пропускную способность.
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.core.rmem_default = 4194304
net.core.wmem_default = 4194304
# Потолок автонастройки TCP. По умолчанию 6 МБ на приём и 4 МБ на отправку:
# на длинном канале (RTT 150–250 мс) этого хватает на ~200 Мбит/с, не больше.
net.ipv4.tcp_rmem = 4096 131072 33554432
net.ipv4.tcp_wmem = 4096 65536 33554432

# --- перегрузка и очередь -------------------------------------------------
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
# После простоя ядро сбрасывает окно в начальное: долгие туннельные соединения
# (прокси держит их часами) каждый раз разгоняются заново.
net.ipv4.tcp_slow_start_after_idle = 0
# Не копить в буфере сокета больше 128 КБ ещё не отправленного: меньше задержка
# под нагрузкой, один тяжёлый поток не душит остальные.
net.ipv4.tcp_notsent_lowat = 131072
net.ipv4.tcp_fastopen = 3

# хостер режет исходящий ICMP (100% потерь даже до 1.1.1.1), поэтому
# классический PMTUD через ICMP "fragmentation needed" не работает —
# TCP-пробинг определяет реальный MTU пути сам, без опоры на ICMP.
net.ipv4.tcp_mtu_probing = 1

# --- много соединений -----------------------------------------------------
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192
net.core.netdev_max_backlog = 16384
net.ipv4.ip_local_port_range = 10240 65535
# Прокси открывает много исходящих: закрытые сокеты в TIME_WAIT не должны
# занимать порты и не давать открыть новые.
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
# Мёртвые клиенты (телефон ушёл из сети) убираем за ~7 минут, а не за 2 часа.
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
-net.netfilter.nf_conntrack_max = 262144
